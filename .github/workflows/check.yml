name: 检查改造源码
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-venv lua5.1 openssl gcc jq gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt
          .venv/bin/python scripts/phone.py --check-toolchain
          .venv/bin/python -m unittest discover -s tests -v
          .venv/bin/python scripts/check_source.py
